name: InsightDeal CI/CD

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-1-backend:
    name: Gate 1 — Backend Unit & E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENABLE_SCHEDULER: "false"
      DATABASE_URL: "sqlite:///:memory:"
      ENV: "development"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend unit tests
        run: python -m pytest backend/tests/unit -v

      - name: Run root unit & contract tests
        run: python -m pytest tests/unit -v

      - name: Run multi-option & history tests
        run: python -m pytest backend/tests/test_multi_option_and_history.py -v

      - name: Run E2E tests
        run: python -m pytest tests/e2e -v

      - name: Verify cloud_feeder.py byte parity
        run: |
          python -c "assert open('backend/scheduler/cloud_feeder.py','rb').read() == open('backend/scripts/cloud_feeder.py','rb').read(), 'cloud_feeder.py mismatch'"

  gate-2-contract:
    name: Gate 2 — OpenAPI <-> Web & Android Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ENABLE_SCHEDULER: "false"
      DATABASE_URL: "sqlite:///:memory:"
      ENV: "development"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify OpenAPI cross-platform contract
        run: python -m pytest tests/unit/test_openapi_cross_platform_contract.py -v

  gate-3-web:
    name: Gate 3 — Web Lint, TSC, Vitest, Build & Toss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest suite
        run: npm test

      - name: Build Next.js production bundle (--webpack)
        run: npm run build

      - name: Verify Toss static export build compatibility
        run: |
          set -euo pipefail
          rm -rf .next out
          STASHED=0
          restore_api() {
            if [ "$STASHED" -eq 1 ] && [ -d ".toss-api-stash" ]; then
              rm -rf src/app/api
              mv .toss-api-stash src/app/api
            fi
          }
          trap restore_api EXIT
          if [ -d "src/app/api" ]; then
            rm -rf .toss-api-stash
            mv src/app/api .toss-api-stash
            STASHED=1
          fi
          NEXT_PUBLIC_TOSS_MINIAPP=true npx next build --webpack
          test -f out/index.html
          test -f out/notifications.html
          test -f out/settings/notifications.html
          echo "Verified Toss static export artifacts in out/."

  gate-4-android:
    name: Gate 4 — Android UnitTest, LintRelease & AssembleRelease
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Create fallback google-services.json for CI if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "insightdeal-ci-mock",
              "storage_bucket": "insightdeal-ci-mock.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.ddaeany0919.insightdeal"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyA00000000000000000000000000000000"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain -Dorg.gradle.configuration-cache=false --max-workers=2

      - name: Run Android lintRelease
        run: ./gradlew :app:lintRelease --no-daemon --console=plain -Dorg.gradle.configuration-cache=false --max-workers=2

      - name: Build Android assembleRelease
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain -Dorg.gradle.configuration-cache=false --max-workers=2

      - name: Upload Android test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insightdeal-android-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.html
            app/build/reports/lint-results-release.xml
          if-no-files-found: ignore

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: insightdeal-release-apk
          path: app/build/outputs/apk/release/*.apk

  deploy-backend:
    name: Deploy Guard (Post 4-Gate)
    needs: [gate-1-backend, gate-2-contract, gate-3-web, gate-4-android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
      - run: echo "All 4 CI gates passed for main push."
