version: '3.8'

services:
  # 1. PostgreSQL 데이터베이스
  db:
    image: postgres:15-alpine
    container_name: insightdeal_db_prod
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-insight_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-insight_secure_pass_123}
      - POSTGRES_DB=${POSTGRES_DB:-insight_deal}
      - TZ=Asia/Seoul
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insight_user} -d ${POSTGRES_DB:-insight_deal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # 2. FastAPI 백엔드 API 서버 (포트 8080 통일 규격, 내장 스케줄러 비활성화)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightdeal_api_prod
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app/backend
    environment:
      - TZ=Asia/Seoul
      - DOCKER_ENV=true
      - ENABLE_SCHEDULER=false
      - PYTHONPATH=/app:/app/backend:.
      - DATABASE_URL=${DATABASE_URL:-postgresql://insight_user:insight_secure_pass_123@db:5432/insight_deal}
      - ENV=${ENV:-production}
      - SERVER_DEVICE_SECRET=${SERVER_DEVICE_SECRET:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - FEEDER_API_TOKEN=${FEEDER_API_TOKEN:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_CLAIM_EMAIL=${VAPID_CLAIM_EMAIL:-mailto:admin@insightdeal.kr}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M

  # 3. 크롤링 수집 및 알림 엔진 스케줄러 (전용 컨테이너)
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightdeal_scheduler_prod
    command: ["python", "-m", "backend.scheduler.main"]
    volumes:
      - ./backend:/app/backend
    environment:
      - TZ=Asia/Seoul
      - DOCKER_ENV=true
      - PYTHONPATH=/app:/app/backend:.
      - DATABASE_URL=${DATABASE_URL:-postgresql://insight_user:insight_secure_pass_123@db:5432/insight_deal}
      - ENV=${ENV:-production}
      - SERVER_DEVICE_SECRET=${SERVER_DEVICE_SECRET:-}
      - FEEDER_API_TOKEN=${FEEDER_API_TOKEN:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_CLAIM_EMAIL=${VAPID_CLAIM_EMAIL:-mailto:admin@insightdeal.kr}
      - FIREBASE_SERVICE_ACCOUNT_PATH=${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 384M

  # 4. Next.js 웹 프론트엔드 (Standalone 3단계 경량 멀티스테이지)
  web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: insightdeal_web_prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DOCKER_ENV=true
      - BACKEND_URL=http://api:8080
      - BACKEND_API_URL=http://api:8080
      - TZ=Asia/Seoul
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
